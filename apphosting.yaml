# Firebase App Hosting configuration.
# Secrets are stored in Cloud Secret Manager; create them with:
#   firebase apphosting:secrets:set MASSIVE_API_KEY
#   firebase apphosting:secrets:set APP_PASSWORD
#   firebase apphosting:secrets:set SESSION_SECRET
# then grant access to the backend when prompted.

runConfig:
  cpu: 1
  memoryMiB: 1024
  minInstances: 0
  maxInstances: 2
  concurrency: 80

env:
  - variable: MASSIVE_API_KEY
    secret: MASSIVE_API_KEY
    availability:
      - RUNTIME
  - variable: APP_PASSWORD
    secret: APP_PASSWORD
    availability:
      - RUNTIME
  - variable: SESSION_SECRET
    secret: SESSION_SECRET
    availability:
      - RUNTIME
