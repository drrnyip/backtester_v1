# Firebase App Hosting configuration.
# Auth secrets (Cloud Secret Manager):
#   firebase apphosting:secrets:set APP_PASSWORD
#   firebase apphosting:secrets:set SESSION_SECRET
# Tick data is local-first under data/es/ — not bundled into App Hosting.

runConfig:
  cpu: 1
  memoryMiB: 1024
  minInstances: 0
  maxInstances: 2
  concurrency: 80

env:
  - variable: APP_PASSWORD
    secret: APP_PASSWORD
    availability:
      - RUNTIME
  - variable: SESSION_SECRET
    secret: SESSION_SECRET
    availability:
      - RUNTIME
